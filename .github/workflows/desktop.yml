name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  macos-universal:
    name: macOS universal (arm64 + x86_64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # pkg both arches untouched (x64 runs under Rosetta on the arm64 runner)
      # + a dispatcher script as the nominal sidecar — pkg binaries can't be
      # lipo'd (appended snapshot offsets break), so arch is picked at runtime.
      - name: Build universal backend sidecar
        run: node scripts/build-sidecar-universal.mjs

      # Unsigned unless APPLE_* secrets are configured (Developer ID + notarization).
      # Missing secrets expand to "" — unset them or the bundler tries to
      # import an empty cert into the keychain and fails.
      - name: Build universal app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx tauri build --target universal-apple-darwin --config src-tauri/tauri.universal.conf.json

      # upload-artifact strips exec bits — zip the .app with ditto to keep them
      - name: Zip .app
        run: |
          ditto -c -k --keepParent \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Atelier.app \
            Atelier_macOS_universal.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: atelier-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            Atelier_macOS_universal.app.zip
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build backend sidecar
        env:
          PKG_TARGET: node22-win-x64
        run: node scripts/build-binary.mjs

      - name: Stage sidecar for Tauri
        env:
          TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: node scripts/prepare-sidecar.mjs

      # Unsigned: first-run SmartScreen warning until Authenticode signing is configured
      - name: Build desktop app
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: atelier-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [macos-universal, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app.zip
            artifacts/**/*.exe
            artifacts/**/*.msi
