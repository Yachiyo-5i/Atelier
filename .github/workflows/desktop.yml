name: Desktop builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
            pkg_target: node22-macos-arm64
          - os: macos-13
            triple: x86_64-apple-darwin
            pkg_target: node22-macos-x64
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            pkg_target: node22-win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build backend sidecar
        env:
          PKG_TARGET: ${{ matrix.pkg_target }}
        run: node scripts/build-binary.mjs

      - name: Stage sidecar for Tauri
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.triple }}
        run: node scripts/prepare-sidecar.mjs

      # Unsigned builds unless signing secrets are configured:
      #   macOS notarization: APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
      #     APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
      #   Windows Authenticode: configure signtool via bundle > windows config
      - name: Build desktop app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: atelier-${{ matrix.triple }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app/**
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
